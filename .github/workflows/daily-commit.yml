name: Daily Automated Commit

on:
  # Runs daily at 05:30 UTC (30 minutes past 5 AM UTC)
  schedule:
    - cron: '30 05 * * *'
  # Allows manual triggering from the Actions tab
  workflow_dispatch:

jobs:
  daily_update:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4
        # We need to fetch history so the workflow can successfully push a new commit.
        with:
          fetch-depth: 0

      # Create/Update a file with the current date/time to ensure there's always a change
      - name: ✍️ Create/Update files with run time
        run: |
          DATE_TIME=$(date '+%Y-%m-%d %H:%M:%S')
          echo "Last run: $DATE_TIME" > daily_run_status.txt
          echo "Workflow run triggered at: $DATE_TIME UTC" >> daily_log.txt

      # Set the commit author email as required by the task
      - name: '24f2006569@ds.study.iitm.ac.in'
        run: |
          git config user.name "Automated Daily Committer"
          git config user.email "24f2006569@ds.study.iitm.ac.in"

      - name: ➕ Commit and Push Changes
        run: |
          # Add the newly created/updated files
          git add daily_run_status.txt daily_log.txt
          
          # Check if there are changes to commit before attempting the commit command
          if git status --porcelain | grep .; then
            # Commit the changes
            git commit -m "🤖 Daily Automated Commit: $(date '+%Y-%m-%d')"
            
            # Push the commit using the GITHUB_TOKEN for authentication
            git push
          else
            echo "No changes detected. Skipping commit."
          fi
